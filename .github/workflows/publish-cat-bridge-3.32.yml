name: Publish reviewed Cat Bridge 3.32
on:
  push:
    branches: [main]
    paths: ['.release/v3.32/manifest.json']
permissions:
  contents: write
concurrency:
  group: cat-bridge-release-3.32
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'sv5byp/Cat-Bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify reviewed assets and publish this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import hashlib, json, os, urllib.request, urllib.error, urllib.parse
          repo = "sv5byp/Cat-Bridge"
          tag = "v3.32"
          expected = [{'name': 'Cat-Bridge-update.bin', 'sha256': '08633b739915ad8c279f1c732eba44a0346ac3438d2ae45a3e4906a35ca1eefa', 'size': 1571257}, {'name': 'Cat-Bridge-update.sig', 'sha256': '2f04f63bd76251008c18e729feadad4412ba129213f3690a0850293077397c98', 'size': 384}, {'name': 'SV5BYP-Cat-Bridge-3.32.zip', 'sha256': 'b9e5c85f86ad7af17d14978b204e3d9bc52b36f41fabe3b52fffb6039e94adec', 'size': 784817}]
          assert os.environ["GITHUB_REPOSITORY"] == repo
          commit = os.environ["GITHUB_SHA"]
          assert len(commit) == 40 and all(c in "0123456789abcdef" for c in commit)
          base = "https://raw.githubusercontent.com/" + repo + "/" + commit + "/.release/v3.32/"
          def download(url, limit):
              with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"Cat-Bridge-Release-3.32"}), timeout=30) as response:
                  data = response.read(limit + 1)
              if len(data) > limit: raise ValueError("Oversized reviewed file")
              return data
          manifest = json.loads(download(base + "manifest.json", 20000))
          assert manifest["repository"] == repo and manifest["tag"] == tag
          assert manifest["assets"] == expected
          assert hashlib.sha256(manifest["body"].encode()).hexdigest() == "4ab87cbaacb9d33a1930ed7af1b80f277a74d1023e033df02e61ec53891f1715"
          files = {}
          for asset in expected:
              data = download(base + urllib.parse.quote(asset["name"]), asset["size"])
              assert len(data) == asset["size"] and hashlib.sha256(data).hexdigest() == asset["sha256"]
              files[asset["name"]] = data
          print("Verified all three reviewed release assets.")
          token = os.environ["GH_TOKEN"]
          def api(method, path, payload=None, raw=False):
              url = path if path.startswith("https://uploads.github.com/") else "https://api.github.com/repos/" + repo + path
              data = payload if raw else None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization":"Bearer " + token, "Accept":"application/vnd.github+json", "User-Agent":"Cat-Bridge-Release-3.32",
                  "X-GitHub-Api-Version":"2022-11-28", "Content-Type":"application/octet-stream" if raw else "application/json"})
              with urllib.request.urlopen(request, timeout=90) as response: return json.load(response)
          try:
              release = api("GET", "/releases/tags/" + tag)
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
              release = api("POST", "/releases", {"tag_name":tag,"target_commitish":commit,"name":manifest["title"],
                  "body":manifest["body"],"draft":True,"prerelease":False})
          assert release["tag_name"] == tag and not release["prerelease"]
          existing = {asset["name"]:asset for asset in release["assets"]}
          assert set(existing).issubset(files), "Unexpected release assets; refusing to alter them"
          for asset in expected:
              if asset["name"] not in existing:
                  assert release["draft"], "Refusing to modify a published partial release"
                  url = "https://uploads.github.com/repos/" + repo + "/releases/" + str(release["id"]) + "/assets?name=" + urllib.parse.quote(asset["name"])
                  existing[asset["name"]] = api("POST", url, files[asset["name"]], raw=True)
              uploaded = existing[asset["name"]]
              assert uploaded["size"] == asset["size"] and uploaded["digest"] == "sha256:" + asset["sha256"]
          if release["draft"]:
              release = api("PATCH", "/releases/" + str(release["id"]), {"draft":False,"prerelease":False,"make_latest":"true"})
          assert not release["draft"] and not release["prerelease"]
          print("Published " + release["html_url"])
          PY
